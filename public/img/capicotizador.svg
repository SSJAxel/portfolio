<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="800" fill="#060a14"/>
  <!-- window -->
  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#0f172a"/>
  <!-- top bar -->
  <rect x="40" y="40" width="1120" height="56" rx="18" fill="#141e33"/>
  <rect x="40" y="78" width="1120" height="18" fill="#141e33"/>
  <circle cx="72" cy="68" r="7" fill="#ff5f57"/>
  <circle cx="96" cy="68" r="7" fill="#febc2e"/>
  <circle cx="120" cy="68" r="7" fill="#28c840"/>
  <text x="600" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed" letter-spacing="1">capicotizador</text>

  <!-- left: form -->
  <text x="80" y="150" font-size="24" font-weight="700" fill="#f1f5f9">Cotizá tu tatuaje</text>
  <g>
    <text x="80" y="205" font-size="13" fill="#94a3b8">Tamaño (cm)</text>
    <rect x="80" y="218" width="560" height="46" rx="10" fill="#1e293b"/>
    <rect x="96" y="233" width="120" height="16" rx="8" fill="#475569"/>

    <text x="80" y="300" font-size="13" fill="#94a3b8">Zona del cuerpo</text>
    <rect x="80" y="313" width="270" height="46" rx="10" fill="#1e293b"/>
    <rect x="370" y="313" width="270" height="46" rx="10" fill="#1e293b"/>

    <text x="80" y="395" font-size="13" fill="#94a3b8">Técnica</text>
    <rect x="80" y="408" width="175" height="46" rx="10" fill="#7c3aed"/>
    <rect x="265" y="408" width="175" height="46" rx="10" fill="#1e293b"/>
    <rect x="450" y="408" width="190" height="46" rx="10" fill="#1e293b"/>

    <text x="80" y="490" font-size="13" fill="#94a3b8">Calidad de productos</text>
    <rect x="80" y="503" width="560" height="8" rx="4" fill="#1e293b"/>
    <circle cx="420" cy="507" r="12" fill="#22c55e"/>
  </g>

  <!-- right: price panel -->
  <rect x="690" y="140" width="430" height="560" rx="16" fill="#111c31" stroke="#22304d" stroke-width="2"/>
  <text x="720" y="195" font-size="14" fill="#94a3b8" letter-spacing="1">PRECIO ESTIMADO</text>
  <text x="720" y="270" font-size="68" font-weight="800" fill="#22c55e">$ 48.500</text>
  <rect x="720" y="310" width="370" height="2" fill="#22304d"/>
  <g font-size="14" fill="#cbd5e1">
    <text x="720" y="350">Base · tamaño × zona</text>
    <text x="1090" y="350" text-anchor="end" fill="#94a3b8">$ 30.000</text>
    <text x="720" y="390">Técnica</text>
    <text x="1090" y="390" text-anchor="end" fill="#94a3b8">× 1.3</text>
    <text x="720" y="430">Agujas + tintas</text>
    <text x="1090" y="430" text-anchor="end" fill="#94a3b8">$ 8.500</text>
  </g>
  <rect x="720" y="610" width="370" height="54" rx="12" fill="#7c3aed"/>
  <text x="905" y="643" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Reservar turno</text>
</svg>
