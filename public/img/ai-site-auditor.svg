<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="800" fill="#eef0f3"/>
  <rect x="40" y="40" width="1120" height="720" rx="18" fill="#ffffff"/>
  <!-- top bar -->
  <rect x="40" y="40" width="1120" height="56" rx="18" fill="#f5f6f8"/>
  <rect x="40" y="78" width="1120" height="18" fill="#f5f6f8"/>
  <circle cx="72" cy="68" r="7" fill="#ff5f57"/>
  <circle cx="96" cy="68" r="7" fill="#febc2e"/>
  <circle cx="120" cy="68" r="7" fill="#28c840"/>
  <rect x="470" y="56" width="260" height="24" rx="12" fill="#e7e9ee"/>
  <text x="600" y="72" text-anchor="middle" font-size="13" fill="#8a909c">ai-site-auditor · local</text>

  <!-- header -->
  <text x="80" y="160" font-size="26" font-weight="700" fill="#0f172a">Reporte de auditoría</text>
  <rect x="80" y="180" width="210" height="26" rx="13" fill="#0ea5a4" opacity="0.14"/>
  <circle cx="98" cy="193" r="5" fill="#0ea5a4"/>
  <text x="112" y="198" font-size="13" fill="#0ea5a4" font-weight="600">IA local · Ollama</text>

  <!-- score gauges -->
  <g text-anchor="middle">
    <!-- Performance 92 -->
    <g transform="translate(220,330)">
      <circle r="52" fill="none" stroke="#e8ebf0" stroke-width="12"/>
      <circle r="52" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="300 327" transform="rotate(-90)"/>
      <text y="14" font-size="40" font-weight="700" fill="#0f172a">92</text>
    </g>
    <text x="220" y="430" font-size="14" fill="#64748b">Performance</text>

    <!-- Accesibilidad 88 -->
    <g transform="translate(470,330)">
      <circle r="52" fill="none" stroke="#e8ebf0" stroke-width="12"/>
      <circle r="52" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="287 327" transform="rotate(-90)"/>
      <text y="14" font-size="40" font-weight="700" fill="#0f172a">88</text>
    </g>
    <text x="470" y="430" font-size="14" fill="#64748b">Accesibilidad</text>

    <!-- Buenas prácticas 95 -->
    <g transform="translate(720,330)">
      <circle r="52" fill="none" stroke="#e8ebf0" stroke-width="12"/>
      <circle r="52" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="310 327" transform="rotate(-90)"/>
      <text y="14" font-size="40" font-weight="700" fill="#0f172a">95</text>
    </g>
    <text x="720" y="430" font-size="14" fill="#64748b">Prácticas</text>

    <!-- SEO 100 -->
    <g transform="translate(970,330)">
      <circle r="52" fill="none" stroke="#e8ebf0" stroke-width="12"/>
      <circle r="52" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="327 327" transform="rotate(-90)"/>
      <text y="14" font-size="40" font-weight="700" fill="#0f172a">100</text>
    </g>
    <text x="970" y="430" font-size="14" fill="#64748b">SEO</text>
  </g>

  <!-- findings list -->
  <text x="80" y="510" font-size="16" font-weight="700" fill="#0f172a">Sugerencias de la IA</text>
  <g>
    <rect x="80" y="530" width="1040" height="56" rx="10" fill="#f6f8fa"/>
    <circle cx="112" cy="558" r="6" fill="#f59e0b"/>
    <rect x="136" y="551" width="420" height="14" rx="7" fill="#9aa3b2"/>
    <rect x="80" y="598" width="1040" height="56" rx="10" fill="#f6f8fa"/>
    <circle cx="112" cy="626" r="6" fill="#ef4444"/>
    <rect x="136" y="619" width="520" height="14" rx="7" fill="#9aa3b2"/>
    <rect x="80" y="666" width="1040" height="56" rx="10" fill="#f6f8fa"/>
    <circle cx="112" cy="694" r="6" fill="#22c55e"/>
    <rect x="136" y="687" width="360" height="14" rx="7" fill="#9aa3b2"/>
  </g>
</svg>
